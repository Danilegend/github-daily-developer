name: Daily Developer Activity

on:
  workflow_dispatch:
  inputs:
    activity_date:
      description: "Date for the activity (YYYY-MM-DD)"
      required: false
      type: string

  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  daily-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate daily activity
  env:
    DAILY_ACTIVITY_DATE: ${{ inputs.activity_date }}
  run: python scripts/daily_activity.py

      - name: Configure Git
        run: |
          git config user.name "Danilegend"
          git config user.email "46860435+Danilegend@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add daily/
          git diff --cached --quiet || git commit -m "docs: add daily developer activity"

      - name: Push changes
        run: git push
